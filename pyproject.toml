[project]
name = "mcp-manager"
version = "0.1.0"
description = "MCP manager server with searchable tool catalog"
authors = [{ name = "Ronnasayd Machado" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0,<3",
    "mcp>=1.29.1,<2",
    "fastembed>=0.4.0",
    "pydantic>=2.0",
    "httpx>=0.28.1",
    "anyio>=4.0",
]

[project.scripts]
mcp-manager = "src.proxy.server:main"
catalog-builder = "src.catalog.builder:main"
mcp_manager_context = "src.hooks.mcp_manager_context:main"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
explicit_package_bases = true
mypy_path = "."
# why: lint hooks run a global mypy; resolve third-party imports from the project venv.
python_executable = ".venv/bin/python"

# why: a project pylint config replaces ~/.pylintrc entirely, so its non-default
# settings are mirrored here; keep in sync with the dotfiles copy.
[tool.pylint.main]
# why: lint hooks run a global pylint; expose the repo root and project venv packages.
init-hook = "import glob, sys; sys.path[:0] = ['.', *glob.glob('.venv/lib/python3*/site-packages')]"
load-plugins = ["pylint.extensions.docparams"]

[tool.pylint.design]
max-statements = 40

[tool.pylint.refactoring]
max-nested-blocks = 3

[tool.pylint.parameter_documentation]
default-docstring-type = "google"

[tool.pylint."messages control"]
disable = [
    "raw-checker-failed",
    "bad-inline-option",
    "locally-disabled",
    "file-ignored",
    "suppressed-message",
    "useless-suppression",
    "deprecated-pragma",
    "use-symbolic-message-instead",
    "use-implicit-booleaness-not-comparison-to-string",
    "use-implicit-booleaness-not-comparison-to-zero",
    "wrong-import-position",
    "invalid-name",
    "missing-function-docstring",
    "missing-module-docstring",
    "missing-class-docstring",
    "wildcard-import",
    "unused-wildcard-import",
    "redefined-outer-name",
    "useless-else-on-loop",
    "line-too-long",
    "trailing-whitespace",
    "trailing-newlines",
    "missing-final-newline",
    "mixed-line-endings",
    "multiple-statements",
    "unnecessary-semicolon",
    "bad-indentation",
    "wrong-spelling-in-comment",
    "unused-import",
    "unused-variable",
    "unused-argument",
    "undefined-variable",
    "wrong-import-order",
    "ungrouped-imports",
    "too-many-branches",
    "unused-format-string-argument",
    "simplifiable-if-statement",
    "no-else-return",
    "no-else-raise",
    "consider-using-in",
    "unnecessary-negation",
    "unnecessary-comprehension",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "pyproject.toml"]
